<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Квест</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<main class="page">

    <section class="card welcome-card">

        <h1>Добро пожаловать!</h1>

        <p class="description">
            Введите название вашей команды, чтобы приступить к выполнению квеста.
        </p>

        <form id="team-form">

            <label for="team-name">
                Название команды
            </label>

            <input
                id="team-name"
                type="text"
                placeholder="Введите название команды"
                autocomplete="off"
                required
            >

            <button type="submit">
                Начать квест
            </button>

        </form>

    </section>

</main>

<script src="js/index.js"></script>

</body>
</html>
