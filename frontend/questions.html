<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Вопросы</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<main class="page">

    <section class="card quest-card">

        <div class="quest-header">
            <div>
                <p class="small-text">Команда</p>
                <h2 id="team-name"></h2>
            </div>
        </div>

        <h1>Вопросы</h1>

        <p class="description">
            Ответьте на все вопросы и отправьте ответы.
        </p>

        <form id="questions-form">

            <!-- Сюда JavaScript добавит вопросы -->
            <div id="questions-container"></div>

            <button type="submit">
                Отправить ответы
            </button>

        </form>

    </section>

</main>

<script src="js/questions.js"></script>

</body>
</html>
